# Local development: throwaway SQLite file, every provider simulated.
spring:
  datasource:
    url: jdbc:sqlite:certplatform-dev.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    url: jdbc:sqlite:certplatform-dev.db

certplatform:
  security:
    # Plaintext secrets are tolerated here because dev never holds real credentials.
    require-encryption: false

cloud:
  providers:
    aws:
      mode: MOCK
      endpoint: http://localhost:8081
    azure:
      mode: MOCK
      endpoint: http://localhost:8081
    gcp:
      mode: MOCK
      endpoint: http://localhost:8081
