    expectedDiscoveryMechanism: IAM_LIST_SERVER_CERTIFICATES
    expectedRenewalType: MANUAL_DELETE_AND_REUPLOAD
    expectedScannerClassification: LEGACY_IAM_CERTIFICATE_STORE
    implemented: true
    limitation: >-
      IMPLEMENTED, not faked. IAM is a GLOBAL service so this certificate has
      no region. It is left unattached because an IAM server certificate can
      only be consumed by a Classic Load Balancer or CloudFront, and this lab
      creates neither. Filed under the IAM path /certificate-test-lab/.

