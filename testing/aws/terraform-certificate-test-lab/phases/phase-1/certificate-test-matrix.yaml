    issuanceMethod: SELF_SIGNED_TLS_PROVIDER
    domain: alb016.<INT>
    sans: [alb016.<INT>, www.alb016.<INT>]
    wildcard: false
    certificateType: RSA-2048
    expiryScenario: HEALTHY
    validityDays: 730
    attachment: UNATTACHED
    awsService: NONE
    storageLocation: AWS_CERTIFICATE_MANAGER
    expectedDiscoveryMechanism: ACM_LIST_CERTIFICATES
    expectedRenewalType: MANUAL_REIMPORT
    expectedScannerClassification: DUPLICATE_CERTIFICATE_UNUSED
    duplicateOf: phase1-cert-016
    implemented: true
    note: >-
      Identical subject CN and SAN set to phase1-cert-016, different key pair,
      serial and SHA-256 fingerprint. Group by subject+SAN, distinguish by
      fingerprint, and flag that one copy is attached and the other is dead.

