    acmPresence: ACM_ISSUED
    issuanceMethod: ACM_PUBLIC_DNS_VALIDATED | ACM_PRIVATE_CA_ISSUED
    domain: cert001.<PUB>
    sans: [cert001.<PUB>]
    wildcard: false
    certificateType: RSA-2048
    expiryScenario: HEALTHY
    validityDays: 395
    attachment: ATTACHED_WHEN_attach_acm_issued_certificates
    awsService: ELBV2_ALB_HTTPS_LISTENER_SNI
    storageLocation: AWS_CERTIFICATE_MANAGER
    expectedDiscoveryMechanism: ACM_LIST_CERTIFICATES
    expectedRenewalType: ACM_AUTOMATIC
    expectedScannerClassification: AWS_MANAGED_AUTO_RENEWABLE
    implemented: true

  - certificateId: phase1-cert-002
