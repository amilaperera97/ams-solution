    purpose: Third certificate on the SAME ALB HTTPS listener - proves 1:N discovery.

  - certificateId: phase1-cert-008
    category: AWS_MANAGED_ACM_ISSUED
    management: AWS_MANAGED
    acmPresence: ACM_ISSUED
    issuanceMethod: ACM_PUBLIC_DNS_VALIDATED | ACM_PRIVATE_CA_ISSUED
    domain: unused008.<PUB>
    sans: [unused008.<PUB>]
    wildcard: false
    certificateType: RSA-2048
    expiryScenario: HEALTHY
    validityDays: 395
    attachment: UNATTACHED
    awsService: NONE
    storageLocation: AWS_CERTIFICATE_MANAGER
    expectedDiscoveryMechanism: ACM_LIST_CERTIFICATES
    expectedRenewalType: ACM_AUTOMATIC_BUT_INELIGIBLE_WHILE_UNUSED
    expectedScannerClassification: AWS_MANAGED_UNUSED
    implemented: true
    note: >-
      ACM does not auto-renew a certificate that is not associated with an AWS
      service, so RenewalEligibility stays INELIGIBLE even though the
      certificate is ACM-issued. Your scanner must model that.

  - certificateId: phase1-cert-009
