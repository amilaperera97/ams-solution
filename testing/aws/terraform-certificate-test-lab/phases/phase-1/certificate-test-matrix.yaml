# ===========================================================================
# Certificate Discovery Test Matrix - Phase 1 (eu-west-1)
#
# Human-readable mirror of local.certificate_scenarios_all in locals.tf.
# locals.tf is the source of truth for Terraform; this file is the source of
# truth for humans and for any test harness that wants the matrix without
# running Terraform.
#
# Placeholders:
#   <PUB>  var.certificate_test_domain       (default: example.com)
#   <INT>  var.certificate_internal_domain   (default: cert-lab.internal)
#
# expiryScenario:  EXPIRED | CRITICAL (<=7d) | WARNING (<=90d) | HEALTHY
# attachment:      ATTACHED | UNATTACHED | REFERENCED_BY_CONFIGURATION
#                  | NOT_APPLICABLE
# ===========================================================================

meta:
  phase: phase-1
  region: eu-west-1
  totalScenarios: 30
  awsManaged: 10
  customerManaged: 20
  namePrefix: certificate-test-lab-phase1
  expiryCoverage:
    EXPIRED: [phase1-cert-024, phase1-cert-030]
    within1Day: [phase1-cert-022]
    within7Days: [phase1-cert-014, phase1-cert-027]
    within30Days: [phase1-cert-021, phase1-cert-026]
    within60Days: [phase1-cert-013, phase1-cert-029]
    within90Days: [phase1-cert-023]
    moreThanOneYear: [phase1-cert-015, phase1-cert-016, phase1-cert-020, phase1-cert-025]
  keyAlgorithmCoverage:
    RSA-2048: [001, 002, 003, 004, 006, 007, 008, 010, 011, 012, 013, 014, 015, 016, 018, 019, 020, 021, 022, 023, 024, 026, 027, 029, 030]
    RSA-4096: [025]
    ECDSA-P256: [009, 017]
    ECDSA-P384: [028]
  notImplementedInPhase1:
    - certificateId: phase1-cert-005
      reason: CloudFront requires an ACM certificate in us-east-1; Phase 1 is eu-west-1 only.
      status: DEFERRED_TO_PHASE_2

# ===========================================================================
# 001-010  AWS-MANAGED / ACM-ISSUED
# ===========================================================================
certificates:

